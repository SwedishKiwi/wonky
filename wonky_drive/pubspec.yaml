name: wonky_drive
description: "Wonky Drive: every file of Wonky Work in one place — uploads, previews and storage."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

# Allowed dependencies: specs/01-architecture.md §2.1 (`wonky_drive`),
# checked by tool/check_dependencies.dart.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Icon font of CupertinoIcons used by shared widgets (shad, wonky_app).
  cupertino_icons: ^1.0.8
  # File upload… picker (Drive 02 §3.1).
  file_picker: ^13.1.0
  go_router: ^18.0.2
  # File previews: signed-URL fetches (Drive 02 §6.1) and PDF rasterizing
  # with the self-hosted pdf.js in web/pdfjs/ (§6.3, spike S-D1).
  http: ^1.6.0
  intl: ^0.20.3
  printing: ^5.15.1
  shad: ^0.99.4
  wonky_app:
    path: ../packages/wonky_app
  wonky_client:
    path: ../wonky_client
  wonky_code_flutter:
    path: ../packages/wonky_code_flutter
  wonky_core:
    path: ../packages/wonky_core
  wonky_ui:
    path: ../packages/wonky_ui

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  # Shell screens in widget tests read ShellServices from a Provider.
  provider: ^6.1.5+1

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Development URLs of the four apps; the server's AppConfigRoute
    # replaces it at runtime (specs/01-architecture.md §2.4).
    - assets/config.json
