publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  crypto: ^3.0.6
  # Vendored with patches DE-1..DE-3 (third_party/dart_eval/PATCHES.md).
  dart_eval: ^0.8.5
  meta: ^1.16.0
  analyzer: ^8.2.0
  native_synchronization: ^0.3.1
  uuid: ^4.5.1
  wonky_core:
    path: ../wonky_core
  wonky_sheets_core:
    path: ../wonky_sheets_core
  wonky_sync_models:
    path: ../wonky_sync_models

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.5
