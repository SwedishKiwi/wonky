  collection: ^1.19.1
  csv: ^8.0.0
  image: ^4.5.4
  intl: ^0.20.3
  meta: ^1.16.0
  pdf: ^3.13.1
  petitparser: ^7.1.0
  timezone: ^0.11.1
  uuid: ^4.5.1
  vector_math: ^2.1.4
  wonky_core:
    path: ../wonky_core
  wonky_sync_models:
