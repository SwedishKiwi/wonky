name: wonky_sync_kit
description: "Pure-Dart offline-sync kit of Wonky Work: row changes, mutation plans, undo inversion, remote patching, table sets (shared by Sheets and Slides)."
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  collection: ^1.19.1
  serverpod_database: 4.1.0-beta.3
  serverpod_serialization: 4.1.0-beta.3
  wonky_core:
    path: ../wonky_core
  wonky_sync_models:
    path: ../wonky_sync_models

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.5
