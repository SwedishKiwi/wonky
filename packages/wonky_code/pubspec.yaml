name: wonky_code
description: "Wonky Work shared code highlighting (pure Dart): languages, token classes, syntax palettes, the TextMate engine (copied from syntax_highlight) and the highlight.js fallback tokenizer."
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  collection: ^1.19.1
  highlight: ^0.7.0
  string_scanner: ^1.4.1
  wonky_core:
    path: ../wonky_core

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.5
