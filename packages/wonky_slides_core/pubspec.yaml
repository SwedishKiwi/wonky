name: wonky_slides_core
description: "Pure Dart core for Wonky Slides: schema, deck model, operations and planner contract, sessions and undo, scene, timeline, themes and layouts (more areas join per specs/wonky_slides/12-implementation-plan.md)."
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  crypto: ^3.0.7
  # HTML clipboard content (03 §12.5: tables, rich text from other apps).
  html: ^0.15.7
  image: ^4.12.0
  meta: ^1.16.0
  pdf: ^3.13.1
  vector_math: ^2.1.4
  wonky_charts:
    path: ../wonky_charts
  wonky_code:
    path: ../wonky_code
  wonky_core:
    path: ../wonky_core
  wonky_fonts:
    path: ../wonky_fonts
  wonky_rich_text:
    path: ../wonky_rich_text
  wonky_sync_kit:
    path: ../wonky_sync_kit
  wonky_sync_models:
    path: ../wonky_sync_models

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.5
