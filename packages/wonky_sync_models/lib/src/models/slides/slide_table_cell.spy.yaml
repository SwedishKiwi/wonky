### A non-empty table cell (Slides 02 §3.6). Its id is always
### SlidesIds.tableCellId(elementId, rowId, columnId), so concurrent writers of
### the same cell share one row (per-column merge). Exists iff a field is set.
class: SlideTableCell
table: slide_table_cell
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  element: SlideElement?, relation(onDelete=Cascade, deferred)
  row: SlideTableAxis?, relation(onDelete=Cascade, deferred)
  column: SlideTableAxis?, relation(onDelete=Cascade, deferred)
  ### Rich text Delta (02 §4).
  text: String?
  ### ColorRef.
  fill: String?
  ### "<width>|<style>|<ColorRef>", style: solid, dashed, dotted, none.
  borderTop: String?
  borderRight: String?
  borderBottom: String?
  borderLeft: String?
  ### top, middle, bottom.
  vAlign: String?
  ### "t,r,b,l" in su.
  padding: String?
  ### Merge origin only; null = 1.
  rowSpan: int?
  colSpan: int?
  createdAt: DateTime, defaultModel=now
indexes:
  slide_table_cell_element_idx:
    fields: elementId
