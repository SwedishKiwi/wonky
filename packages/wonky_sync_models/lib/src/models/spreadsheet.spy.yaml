### A spreadsheet. Its id is always the uuidSpaceId of the space it lives in
### (one spreadsheet per space, Sheets 02 §3.1).
class: Spreadsheet
table: spreadsheet
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  ### Mirrored to DriveItem.name by the server.
  title: String
  ### Number/date parsing and formatting, function argument separator (e.g. en_US).
  locale: String
  ### IANA time zone.
  timeZone: String
  recalcMode: RecalcMode, default=onChange
  iterativeCalc: bool, default=false
  maxIterations: int, default=50
  convergenceThreshold: double, default=0.05
  defaultFontFamily: String, default='Inter'
  defaultFontSize: double, default=10.0
  ### {v, name, fonts: {text}, colors: {...}} (Sheets 06 §13.1).
  themeJson: String
  ### Function name language; null = English (Sheets 04 §15, P2).
  displayLanguage: String?
  ### Auth user UUID of the creator.
  createdBy: UuidValue
  createdAt: DateTime, defaultModel=now
