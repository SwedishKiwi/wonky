### A saved, named filter view.
class: FilterView
table: filter_view
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  name: String
  rangeJson: String
  criteriaJson: String
  sortJson: String?
  createdBy: UuidValue
  createdAt: DateTime, defaultModel=now
