### A row entity with a stable id, ordered by sortKey (Sheets 02 §3.2).
class: SheetRow
table: sheet_row
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  sortKey: String
  ### Null = default/auto-fit.
  height: double?
  ### User-hidden; filter-hidden is computed.
  hidden: bool, default=false
  ### Row default format.
  formatJson: String?
  createdAt: DateTime, defaultModel=now
indexes:
  sheet_row_order_idx:
    fields: sheetId, sortKey
