### A named range, named formula or named function.
class: NamedRange
table: named_range
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  spreadsheet: Spreadsheet?, relation(onDelete=Cascade, deferred)
  ### Case-insensitive unique (client-enforced).
  name: String
  ### GridRange, or null when formula is used.
  rangeJson: String?
  ### Named formula / LAMBDA in stored-reference form.
  formula: String?
  comment: String?
  ### {kind, description, params, examples} (Sheets 05 §24 F3).
  metaJson: String?
  createdAt: DateTime, defaultModel=now
