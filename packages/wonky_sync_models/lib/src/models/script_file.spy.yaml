### A Dart source file of a script project (whole-file LWW).
class: ScriptFile
table: script_file
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  project: ScriptProject?, relation(onDelete=Cascade, deferred)
  name: String
  sortKey: String
  source: String
  ### sha256 hex of source.
  contentHash: String
  updatedBy: UuidValue
  updatedAt: DateTime
  createdAt: DateTime, defaultModel=now
