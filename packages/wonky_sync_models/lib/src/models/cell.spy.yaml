### A non-empty cell. Its id is always SheetsIds.cellId(sheetId, rowId, colId), so
### concurrent writers of the same cell share one CRDT chain. Every format
### attribute is its own column (field-level merge).
class: Cell
table: cell
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  row: SheetRow?, relation(onDelete=Cascade, deferred)
  column: SheetColumn?, relation(onDelete=Cascade, deferred)
  ### Typed encoding (=, n:, s:, b:, e:, r:); null = no value.
  content: String?
  ### Cell note (not a comment).
  note: String?
  numberFormat: String?
  fontFamily: String?
  fontSize: double?
  bold: bool?
  italic: bool?
  underline: bool?
  strikethrough: bool?
  ### "#RRGGBB" or "theme:accent3".
  textColor: String?
  fillColor: String?
  hAlign: HorizontalAlign?
  vAlign: VerticalAlign?
  wrap: WrapStrategy?
  ### -90..90 degrees; 255 = vertical stacked.
  rotation: int?
  ### "<style>|<color>" or "none".
  borderTop: String?
  borderRight: String?
  borderBottom: String?
  borderLeft: String?
  ### Whole-cell hyperlink.
  linkUrl: String?
  createdAt: DateTime, defaultModel=now
indexes:
  cell_row_idx:
    fields: sheetId, rowId
  cell_col_idx:
    fields: sheetId, columnId
