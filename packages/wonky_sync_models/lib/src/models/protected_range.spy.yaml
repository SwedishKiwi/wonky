### Advisory protection of a range or a whole sheet.
class: ProtectedRange
table: protected_range
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  ### Null = whole sheet.
  rangeJson: String?
  ### Unprotected ranges for sheet protection.
  exceptRangesJson: String?
  description: String?
  warningOnly: bool, default=false
  ### List of user UUIDs allowed to edit (owner always).
  editorsJson: String
  createdBy: UuidValue
  createdAt: DateTime, defaultModel=now
