### Compilation result, written by the server; id = SheetsIds.scriptBuildId(projectId).
class: ScriptBuild
table: script_build
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  project: ScriptProject?, relation(onDelete=Cascade, deferred)
  status: ScriptBuildStatus, default=ok
  sourceHash: String
  ### EVC bytecode in cloud storage (null if errors).
  bytecodeFileUuid: UuidValue?
  diagnosticsJson: String
  exportsJson: String
  apiVersion: int, default=1
  compilerVersion: String, default=''
  requestedBy: UuidValue?
  lastGoodSourceHash: String?
  lastGoodBytecodeFileUuid: UuidValue?
  lastGoodExportsJson: String?
  lastGoodBuiltAt: DateTime?
  positionsFileUuid: UuidValue?
  builtAt: DateTime
  createdAt: DateTime, defaultModel=now
