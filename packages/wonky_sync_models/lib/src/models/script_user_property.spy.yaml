### A per-user script property; lives in the user's personal space.
class: ScriptUserProperty
table: script_user_property
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  ### Plain UUID: the spreadsheet lives in another space.
  spreadsheetId: UuidValue
  key: String
  value: String
  createdAt: DateTime, defaultModel=now
indexes:
  script_user_property_idx:
    fields: spreadsheetId, key
