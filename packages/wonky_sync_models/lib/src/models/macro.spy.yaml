### A recorded or written macro bound to a function.
class: Macro
table: macro
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  project: ScriptProject?, relation(onDelete=Cascade, deferred)
  name: String
  functionName: String
  ### 1..10 → Mod+Alt+Shift+<n>.
  shortcutSlot: int?
  createdAt: DateTime, defaultModel=now
