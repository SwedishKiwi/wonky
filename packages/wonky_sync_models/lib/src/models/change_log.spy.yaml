### One row per undo transaction, written in the same transaction as the
### change (Sheets 02 §3.7). Consumed by the server after onMergeSuccess.
class: ChangeLog
table: change_log
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  spreadsheet: Spreadsheet?, relation(onDelete=Cascade, deferred)
  ### Auth user UUID of the author.
  userId: UuidValue
  actorKind: ActorKind
  sessionId: String
  ### Undo label, e.g. "Paste".
  label: String
  ### {sheets, ranges, kinds, deleted, revived, structureOverflow}.
  summaryJson: String
  ### Before/after content for at most 200 cells; null if larger.
  detailJson: String?
  at: DateTime
  createdAt: DateTime, defaultModel=now
indexes:
  change_log_at_idx:
    fields: spreadsheetId, at
