### A column entity with a stable id, ordered by sortKey.
class: SheetColumn
table: sheet_column
database: sync
fields:
  id: UuidValue, defaultModel=random_v7
  sheet: Sheet?, relation(onDelete=Cascade, deferred)
  sortKey: String
  width: double?
  hidden: bool, default=false
  ### Column default format.
  formatJson: String?
  createdAt: DateTime, defaultModel=now
indexes:
  sheet_column_order_idx:
    fields: sheetId, sortKey
