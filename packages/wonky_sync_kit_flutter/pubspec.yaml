name: wonky_sync_kit_flutter
description: "Offline-sync client of Wonky Work (Flutter): replica, change journal, writer, sync controller, session building blocks (shared by Sheets and Slides)."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  collection: ^1.19.1
  path: ^1.9.1
  # Desktop location of the replica files.
  path_provider: ^2.1.6
  # Read-only recovery read of a replica that cannot be opened (suite 12 §2.5).
  sqlite3: ^3.7.0
  serverpod_database: 4.1.0-beta.3
  serverpod_offline_sync_client: 0.0.9
  web: ^1.1.1
  wonky_app:
    path: ../wonky_app
  wonky_client:
    path: ../../wonky_client
  wonky_core:
    path: ../wonky_core
  wonky_sync_kit:
    path: ../wonky_sync_kit
  wonky_sync_models:
    path: ../wonky_sync_models
  wonky_ui:
    path: ../wonky_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
