name: wonky_ui
description: "Wonky Work design system: theme, tokens and custom shad-style widgets."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_test:
    sdk: flutter
  intl: ^0.20.3
  shad: ^0.99.4

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
flutter:
  generate: true
