name: wonky_app
description: "Wonky Work app shell: client bootstrap, auth, routing, drive, sharing, commands, undo, collaboration UI."
publish_to: none

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  desktop_drop: ^0.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  serverpod_auth_idp_client: 4.1.0-beta.3
  serverpod_auth_idp_flutter: 4.1.0-beta.3
  serverpod_flutter: 4.1.0-beta.3
  shad: ^0.99.4
  shared_preferences: ^2.5.6
  sqlite_async: ^0.14.5
  url_launcher: ^6.3.3
  web: ^1.1.1
  wonky_client:
    path: ../../wonky_client
  wonky_core:
    path: ../wonky_core
  wonky_ui:
    path: ../wonky_ui

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'

flutter:
  generate: true
  # Product icons of the suite (Wonky Work, Drive, Write, Sheets, Slides),
  # shown by `WonkyProductIcon` (suite 02 §5).
  assets:
    - assets/icons/
