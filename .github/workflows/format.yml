name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  # Keep in step with analyze.yml, tests.yml and deploy.yml.
  FLUTTER_VERSION: '3.47.5'

jobs:
  # Every workspace member plus tool/. Generated code is checked too:
  # `serverpod generate` writes formatted output.
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true

      # The formatter reads each package's language version and
      # analysis_options.yaml `formatter:` settings from the resolved packages.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          members=$(awk '/^workspace:/{f=1;next} /^[^ -]/{f=0} f && /^ *- /{sub(/^ *- */,""); sub(/ *#.*/,""); print}' pubspec.yaml)
          dart format --output=none --set-exit-if-changed $members tool
