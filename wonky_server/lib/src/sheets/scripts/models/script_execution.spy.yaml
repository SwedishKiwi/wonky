### One script execution, client or server (Sheets 09 §13.1). Kept 30 days,
### at most 10,000 per spreadsheet.
class: ScriptExecution
table: script_execution
fields:
  ### Execution id (generated by the runner: client or server).
  uuid: UuidValue
  spreadsheetUuid: UuidValue
  projectId: UuidValue?
  functionName: String
  kind: ScriptExecutionKind
  triggerId: UuidValue?
  ### Initiator (UserProfile id).
  userId: int
  ### Run-as user (installer for installable triggers).
  runAsUserId: int
  runtime: ScriptRuntimeKind
  status: ScriptExecutionStatus
  buildSourceHash: String
  startedAt: DateTime
  durationMs: int
  ### JSON lines {t, level, msg}, ≤ 100 KB.
  logs: String
  errorMessage: String?
  ### Mapped frames [{function, file, line, column}].
  errorStackJson: String?
  ### ServerChangeRecord for revert (server runs that wrote).
  changeId: UuidValue?
  cellsRead: int
  cellsWritten: int
  fetchCalls: int
  ### Custom functions: one row per recalculation batch.
  callCount: int, default=1
indexes:
  script_exec_uuid_idx:
    fields: uuid
    unique: true
  script_exec_sheet_idx:
    fields: spreadsheetUuid, startedAt
  script_exec_user_idx:
    fields: userId, startedAt
