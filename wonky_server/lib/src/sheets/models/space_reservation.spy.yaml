### An empty space reserved for offline creation of a spreadsheet or (v2) a
### deck (suite 12 §2.2, §2.6).
class: SpaceReservation
table: space_reservation
serverOnly: true
fields:
  userId: int, relation(parent=user_profile, onDelete=Cascade)
  spaceUuid: UuidValue
  ### (v2) The kind of item the space is reserved for.
  kind: SpaceKind, default=spreadsheet
  createdAt: DateTime
  ### Set when a spreadsheet is registered in the space.
  usedAt: DateTime?
indexes:
  space_reservation_space_idx:
    fields: spaceUuid
    unique: true
  space_reservation_user_idx:
    fields: userId, usedAt
