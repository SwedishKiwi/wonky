### A server-side change on a spreadsheet that can be reverted/reapplied
### (Sheets 12 §2.5, undo domain sheets.serverChange).
class: ServerChangeRecord
table: server_change_record
serverOnly: true
fields:
  changeId: UuidValue
  spreadsheetUuid: UuidValue
  userId: int
  actorKind: ActorKind
  label: String
  ### gzip+base64 JSON list of row changes with before/after columns.
  inverseJson: String?
  inverseFileId: UuidValue?
  forwardFileId: UuidValue?
  cellsAffected: int
  createdAt: DateTime
  expiresAt: DateTime
  revertedAt: DateTime?
  revertChangeId: UuidValue?
indexes:
  server_change_sheet_idx:
    fields: spreadsheetUuid, createdAt
  server_change_id_idx:
    fields: changeId
    unique: true
