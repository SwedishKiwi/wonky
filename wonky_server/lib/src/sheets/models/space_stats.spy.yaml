### Row counts of a spreadsheet space for download progress.
class: SpaceStats
fields:
  spaceUuid: UuidValue
  ### table name → visible row count.
  rowCounts: Map<String, int>
  totalRows: int
  sheetCount: int
  cellCount: int
  ### Grid size (Σ rows × columns), counted against the cell limit.
  gridCells: int
