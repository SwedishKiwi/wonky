### Marks a synced ChangeLog row as consumed (exactly-once processing).
class: SheetsChangeLogReceipt
table: sheets_change_log_receipt
serverOnly: true
fields:
  changeLogId: UuidValue
  spaceUuid: UuidValue
  processedAt: DateTime
indexes:
  sheets_change_log_receipt_idx:
    fields: changeLogId
    unique: true
  sheets_change_log_receipt_space_idx:
    fields: spaceUuid, processedAt
