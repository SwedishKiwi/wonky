### A Suggest-mode AI changes preview persisted in the database (Sheets 12
### §6.3), so any server instance can show, apply or discard it until it
### expires (30 min).
class: SheetsAiPreviewRecord
table: sheets_ai_preview_record
serverOnly: true
fields:
  previewId: String
  userId: int
  spreadsheetUuid: UuidValue
  ### The `SheetsAiPreview` shown by the dialog (JSON).
  previewJson: String
  ### gzip+base64 JSON `{callId: {kinds: [..], changes: [RowChange]}}`.
  changesJson: String
  createdAt: DateTime
  expiresAt: DateTime
indexes:
  sheets_ai_preview_id_idx:
    fields: previewId
    unique: true
  sheets_ai_preview_expires_idx:
    fields: expiresAt
