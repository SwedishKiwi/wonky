### Kinds of [AssistantEvent]s streamed by `assistant.chat`.
enum: AssistantEventType
serialized: byName
values:
  ### First event: the thread (created when new) and the run id.
  - started
  - textDelta
  ### A progress note between tool calls (thinking display "updates").
  - progress
  - toolStarted
  - toolFinished
  ### The destructive guard asks the user (assistant.confirm).
  - confirmationRequired
  - usage
  ### The answer was cut off (max_tokens): the panel offers "Continue".
  - maxTokens
  - refusal
  ### Sheets Suggest mode: the run recorded changes in a preview
  ### (previewId) for the AI changes preview dialog (Sheets 12 §6.3).
  - previewReady
  ### Sheets 12 §6.2: run a `ui.sheets.*` tool (toolName, argsJson) in the
  ### requesting window; it answers with `assistant.uiToolResult`
  ### (toolUseId).
  - uiToolCall
  - error
  ### Last event of a run.
  - done
