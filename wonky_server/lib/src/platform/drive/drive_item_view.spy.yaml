### A drive item as seen by the calling user.
class: DriveItemView
fields:
  uuid: UuidValue
  kind: DriveItemKind
  name: String
  description: String?
  contentRef: UuidValue?
  parentUuid: UuidValue?
  owner: UserSummary
  ### The caller's effective role.
  role: AccessRole
  ### Shared with anyone besides the owner (people or link).
  shared: bool
  linkRole: AccessRole?
  thumbnailFileId: UuidValue?
  sizeBytes: int
  createdAt: DateTime
  modifiedAt: DateTime
  modifiedBy: UserSummary?
  trashedAt: DateTime?
  templateOf: TemplateCategory?
  starred: bool
  pinnedOffline: bool
  lastOpenedAt: DateTime?
  lastEditedAt: DateTime?
  editorsCanShare: bool
  nonEditorsCanExport: bool
  viewersSeeComments: bool
  ### (v2) Images/attachments stored for this item (Drive 03 §2).
  attachmentBytes: int, default=0
  ### (v2) sizeBytes + attachmentBytes: what the File size column, the
  ### details panel and the Storage page show (Drive 03 §2).
  countedBytes: int, default=0
  ### (v2) Files only (Drive 02 §1.1); null for other kinds.
  mimeType: String?
  fileCategory: FileCategory?
  uploadState: FileUploadState?
  fileMetaJson: String?
  previewFileId: UuidValue?
