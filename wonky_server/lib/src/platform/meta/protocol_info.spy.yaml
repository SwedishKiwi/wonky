### Returned by `meta.getInfo()`; clients check it on connect (specs/01 §7).
class: ProtocolInfo
fields:
  serverVersion: String
  minClientVersion: String
  ### Offline-sync schema hash; clients with a different hash must update.
  syncTablesHash: String
  runMode: String
  features: FeatureFlags
  limits: ServerLimits
  serverTime: DateTime
  ### Redis is configured (multi-instance messaging, specs/13 §4).
  redisEnabled: bool, default=false
  ### The server reached Redis (a ping) when this was returned.
  redisConnected: bool, default=false
