### GitHub webhook deliveries already handled (dedupe; purged after 7 days).
class: BoardGithubDelivery
table: board_github_delivery
serverOnly: true
fields:
  deliveryId: String
  event: String
  receivedAt: DateTime
  ### The fields of the payload the handler needs (compact JSON, specs/16
  ### §13.3); cleared once handled.
  payload: String?
  processedAt: DateTime?
  ### Handler runs so far (retried a few times on errors).
  attempts: int, default=0
indexes:
  board_github_delivery_idx:
    fields: deliveryId
    unique: true
