name: wonky_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  clock: ^1.1.3
  collection: ^1.19.1
  crypto: ^3.0.7
  dart_quill_delta: ^9.6.0
  mcp_dart: ^2.4.2
  serverpod: 4.1.0-beta.3
  serverpod_auth_idp_server: 4.1.0-beta.3
  serverpod_cloud_storage: 4.1.0-beta.3
  serverpod_offline_sync: 0.0.9
  serverpod_offline_sync_server: 0.0.9
  uuid: ^4.6.0
  wonky_core:
    path: ../packages/wonky_core
  wonky_sheets_core:
    path: ../packages/wonky_sheets_core
  wonky_sync_models:
    path: ../packages/wonky_sync_models
  wonky_write_core:
    path: ../packages/wonky_write_core
  yaml: ^3.1.4

dev_dependencies:
  async: ^2.13.1
  lints: '>=3.0.0 <7.0.0'
  meta: ^1.19.0
  serverpod_test: 4.1.0-beta.3
  test: ^1.25.5
  wonky_mcp_stdio:
    path: ../packages/wonky_mcp_stdio

serverpod:
  scripts:
    # Build both Flutter web apps into the server's web directory
    # (specs/01-architecture.md §2.4): wonky_write → web/write (/write/),
    # wonky_sheets → web/sheets (/sheets/). Built with --wasm (cross-origin
    # isolation for OPFS/SharedArrayBuffer, specs/13 §3).
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      windows: >-
        (if exist web\write rmdir /S /Q web\write)
        & (if exist web\sheets rmdir /S /Q web\sheets)
        & cd /D ..\wonky_write
        & set ARGS=web --wasm --base-href /write/
        && (call flutter build %ARGS% || (flutter clean && call flutter build %ARGS%))
        && xcopy /E /I /Y build\web ..\wonky_server\web\write
        && cd /D ..\wonky_sheets
        && set ARGS=web --wasm --base-href /sheets/
        && (call flutter build %ARGS% || (flutter clean && call flutter build %ARGS%))
        && xcopy /E /I /Y build\web ..\wonky_server\web\sheets
      posix: |
        set -e
        rm -rf ../wonky_server/web/write ../wonky_server/web/sheets
        cd ../wonky_write
        set -- web --wasm --base-href /write/ --output ../wonky_server/web/write
        flutter build "$@" || { flutter clean && flutter build "$@"; }
        cd ../wonky_sheets
        set -- web --wasm --base-href /sheets/ --output ../wonky_server/web/sheets
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Both apps are launched by `serverpod start` from their flutter_driver
  # entry point, on fixed ports so their origins are stable for
  # `allowedOrigins` and cookie auth (specs/01-architecture.md §2.4–2.5).
  flutter_apps:
    write:
      path: ../wonky_write
      displayName: "Wonky Write"
      auto_launch: true
      target: lib/driver.dart
      web-port: 8101
    sheets:
      path: ../wonky_sheets
      displayName: "Wonky Sheets"
      auto_launch: true
      target: lib/driver.dart
      web-port: 8102
