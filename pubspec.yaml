name: _
publish_to: none

environment:
  sdk: '^3.12.2'

workspace:
  - wonky_client
  - wonky_server
  - wonky_write
  - wonky_sheets
  - packages/wonky_core
  - packages/wonky_ui
  - packages/wonky_app
  - packages/wonky_sync_models
  - packages/wonky_write_core
  - packages/wonky_sheets_core
  - packages/wonky_sheets_script
  - packages/wonky_mcp_stdio

# Vendored packages (specs/01-architecture.md §2.3). Pub workspaces only honor
# overrides at the root.
dependency_overrides:
  # Vendored super_editor with Wonky patches SE-1…SE-5 (third_party/super_editor/PATCHES.md).
  super_editor:
    path: third_party/super_editor
  # Vendored with patch AT-1 (third_party/attributed_text/PATCHES.md), needed by super_editor.
  attributed_text:
    path: third_party/attributed_text
  serverpod_offline_sync:
    path: third_party/serverpod_offline_sync
  flutter_secure_storage: ^10.0.0
  # sqlite3_web 0.9.5 made WorkerDatabase `base`, which breaks the web build of
  # sqlite_async 0.14.5. Keep web/db_worker.js in step with sqlite_async.
  sqlite3_web: 0.9.4
